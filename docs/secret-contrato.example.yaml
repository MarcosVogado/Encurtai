# ARQUIVO DE DOCUMENTAÇÃO — não aplique este arquivo.
#
# Mostra o CONTRATO do Secret (quais chaves a aplicação espera) sem carregar
# nenhum valor. No pipeline, o Secret é criado a partir dos secrets do GitHub
# Environment, assim:
#
#   kubectl create secret generic encurtai-secrets \
#     --from-literal=mongo-user="$MONGO_USER" \
#     --from-literal=mongo-password="$MONGO_PASSWORD" \
#     --from-literal=mongo-connection-string="$MONGO_CONNECTION_STRING" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# O `--dry-run=client | kubectl apply` é de propósito: é idempotente e não
# materializa o valor em arquivo nem no log do runner.
apiVersion: v1
kind: Secret
metadata:
  name: encurtai-secrets
type: Opaque
stringData:
  mongo-user: "<vem do secret MONGO_USER do Environment>"
  mongo-password: "<vem do secret MONGO_PASSWORD do Environment>"
  mongo-connection-string: "<vem do secret MONGO_CONNECTION_STRING do Environment>"

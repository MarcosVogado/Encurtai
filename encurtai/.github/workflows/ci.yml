name: CI

# Quando o pipeline dispara: em todo push na main e em todo Pull Request para a main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # runner Linux; .NET roda liso aqui

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar o .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'   # fixa a versão -> build reprodutível

      - name: Restaurar dependências
        run: dotnet restore

      - name: Compilar (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Rodar os testes
        run: dotnet test --configuration Release --no-build --verbosity normal
